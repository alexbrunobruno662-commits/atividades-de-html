<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Formulário</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 0;
            padding: 20px;
        }

        .formulario {
            width: 500px;
            margin: 0 auto;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 25px;
        }

        fieldset {
            border: 1px solid #999;
            padding: 15px;
            margin-bottom: 15px;
        }

        legend {
            font-size: 18px;
            font-weight: bold;
            padding: 0 5px;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            height: 28px;
            border: 1px solid #999;
            box-sizing: border-box;
        }

        select {
            background-color: white;
        }

        .opcao {
            margin: 8px 0;
        }

        .opcao input {
            margin-right: 8px;
        }

        textarea {
            width: 100%;
            height: 130px;
            border: 1px solid #999;
            box-sizing: border-box;
            resize: none;
        }

        .botoes {
            margin-top: 15px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 5px 12px;
            margin-right: 8px;
            background-color: #eee;
            border: 1px solid #999;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="formulario">

        <h1>Formulário</h1>

        <form>

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco">

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade">

                <label for="estado">Estado:</label>
                <select id="estado" name="estado">
                    <option>São Paulo</option>
                    <option>Rio de Janeiro</option>
                    <option>Minas Gerais</option>
                    <option>Paraná</option>
                    <option>Bahia</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Dados profissionais</legend>

                <label>Área de atuação:</label>

                <div class="opcao">
                    <input type="radio" name="area" value="comercio">
                    Comércio
                </div>

                <div class="opcao">
                    <input type="radio" name="area" value="financeiro">
                    Financeiro
                </div>

                <div class="opcao">
                    <input type="radio" name="area" value="recreacao">
                    Recreação
                </div>

                <div class="opcao">
                    <input type="radio" name="area" value="administrativo">
                    Administrativo
                </div>

                <div class="opcao">
                    <input type="radio" name="area" value="juridico">
                    Jurídico
                </div>

                <label>Área de interesse:</label>

                <div class="opcao">
                    <input type="checkbox" name="interesse" value="computacao">
                    Computação
                </div>

                <div class="opcao">
                    <input type="checkbox" name="interesse" value="biologia">
                    Biologia
                </div>

                <div class="opcao">
                    <input type="checkbox" name="interesse" value="meio-ambiente">
                    Meio Ambiente
                </div>

                <div class="opcao">
                    <input type="checkbox" name="interesse" value="engenharia">
                    Engenharia
                </div>

                <div class="opcao">
                    <input type="checkbox" name="interesse" value="historia">
                    História
                </div>

                <label for="mensagem">mini-curriculo: </label>
                <textarea id="mensagem" name="mini-curriculo"></textarea>


            </fieldset>

            <div class="botoes">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>

        </form>

    </div>

</body>

</html>
